<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mcpov-title mcpov-desc">
<title id="mcpov-title">What MCP standardizes</title>
<desc id="mcpov-desc">The user talks to an AI application acting as the MCP Host, which reaches an MCP Server through an MCP Client. That connection is what MCP standardizes. Behind the server sit an existing API, a database and local files. The host also calls an LLM.</desc>
