<svg viewBox="0 0 400 291" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="resolve-title resolve-desc">
<title id="resolve-title">npm run dev が解決される順</title>
<desc id="resolve-desc">npm run devはpackage.jsonを読み、scripts.devの定義を探し、そこに書かれたviteを実行して開発サーバーを起動する。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
<rect x="0" y="0" width="400" height="291" rx="8" fill="#fcfcfb"/>
<rect x="12" y="16" width="376" height="31" rx="6" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1"/>
<text x="200" y="36" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">npm run dev</text>
<rect x="12" y="73" width="376" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="93" font-size="12" text-anchor="middle" fill="#0b0b0b">package.json を読む</text>
<rect x="12" y="130" width="376" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="150" font-size="12" text-anchor="middle" fill="#0b0b0b">scripts.dev を探す</text>
<rect x="12" y="187" width="376" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="207" font-size="12" text-anchor="middle" fill="#0b0b0b">vite を実行する</text>
<rect x="12" y="244" width="376" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="264" font-size="12" text-anchor="middle" fill="#0b0b0b">開発サーバーが起動する</text>
<path d="M200,47 L200,67" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
