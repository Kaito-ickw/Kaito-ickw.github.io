<path d="M200,104 L200,124" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M196.4,124 L203.6,124 L200,130 Z" fill="#c3c2b7"/>
<path d="M200,161 L200,181" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M196.4,181 L203.6,181 L200,187 Z" fill="#c3c2b7"/>
<path d="M200,218 L200,238" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M196.4,238 L203.6,238 L200,244 Z" fill="#c3c2b7"/>
</svg>
