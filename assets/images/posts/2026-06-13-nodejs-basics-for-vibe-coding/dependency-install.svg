<svg viewBox="0 0 400 192" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="install-title install-desc">
<title id="install-title">package.json と package-lock.json の役割の違い</title>
<desc id="install-desc">package.jsonが許容するバージョンの範囲を、package-lock.jsonが具体的な依存関係を持ち、npm installが両方を読んでnode_modulesを作る。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
<rect x="0" y="0" width="400" height="192" rx="8" fill="#fcfcfb"/>
<rect x="12" y="16" width="182" height="46" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="103" y="36" font-size="12" text-anchor="middle" fill="#0b0b0b">package.json</text>
<text x="103" y="51" font-size="12" text-anchor="middle" fill="#0b0b0b">許容するバージョン</text>
<rect x="206" y="16" width="182" height="46" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="297" y="36" font-size="12" text-anchor="middle" fill="#0b0b0b">package-lock.json</text>
<text x="297" y="51" font-size="12" text-anchor="middle" fill="#0b0b0b">具体的な依存関係</text>
<rect x="12" y="88" width="376" height="31" rx="6" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1"/>
<text x="200" y="108" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">npm install</text>
<rect x="12" y="145" width="376" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="165" font-size="12" text-anchor="middle" fill="#0b0b0b">node_modules</text>
