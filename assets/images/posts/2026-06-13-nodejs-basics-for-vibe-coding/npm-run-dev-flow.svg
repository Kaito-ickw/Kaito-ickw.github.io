<svg viewBox="0 0 400 348" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="npmdev-title npmdev-desc">
<title id="npmdev-title">npm run dev が開発サーバーを起動するまで</title>
<desc id="npmdev-desc">AIエージェントがnpm run devを実行すると、package.jsonが読まれ、そこに書かれたViteやNext.jsといったツールがNode.js上で動き、開発サーバーが立ち上がる。</desc>
