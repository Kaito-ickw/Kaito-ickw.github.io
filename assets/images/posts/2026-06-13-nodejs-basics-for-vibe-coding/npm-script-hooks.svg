<svg viewBox="0 0 400 222" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hooks-title hooks-desc">
<title id="hooks-title">prebuild と postbuild が呼ばれる順</title>
<desc id="hooks-desc">npm run buildを実行すると、prebuildが事前処理として、buildが本処理として、postbuildが事後処理として、この順に自動で呼ばれる。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
<rect x="0" y="0" width="400" height="222" rx="8" fill="#fcfcfb"/>
<rect x="12" y="16" width="376" height="46" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="36" font-size="12" text-anchor="middle" fill="#0b0b0b">prebuild</text>
<text x="200" y="51" font-size="12" text-anchor="middle" fill="#0b0b0b">事前処理</text>
<rect x="12" y="88" width="376" height="46" rx="6" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1"/>
<text x="200" y="108" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">build</text>
<text x="200" y="123" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">本処理</text>
<rect x="12" y="160" width="376" height="46" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="180" font-size="12" text-anchor="middle" fill="#0b0b0b">postbuild</text>
<text x="200" y="195" font-size="12" text-anchor="middle" fill="#0b0b0b">事後処理</text>
<path d="M200,62 L200,82" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M196.4,82 L203.6,82 L200,88 Z" fill="#c3c2b7"/>
<path d="M200,134 L200,154" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M196.4,154 L203.6,154 L200,160 Z" fill="#c3c2b7"/>
</svg>
