<svg viewBox="0 0 400 291" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flywheel-title flywheel-desc">
<title id="flywheel-title">フィジカルAIのデータフライホイール</title>
<desc id="flywheel-desc">LLMやVLMがロボットに指示理解と意味的類推を与えることで、限定タスクなら経済的に成立する。運用のなかで実世界の観測・行動・失敗・介入のデータが蓄積し、世界モデルや能動的探索、継続学習と組み合わさることで、記号接地・因果理解・自己改善能力が補われていく。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
<rect x="0" y="0" width="400" height="291" rx="8" fill="#fcfcfb"/>
<rect x="12" y="16" width="376" height="31" rx="6" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1"/>
<text x="200" y="36" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">LLM/VLMがロボットに指示理解・意味的類推を与える</text>
<rect x="12" y="73" width="376" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="93" font-size="12" text-anchor="middle" fill="#0b0b0b">限定タスクでフィジカルAIが経済的に成立する</text>
<rect x="12" y="130" width="376" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="150" font-size="12" text-anchor="middle" fill="#0b0b0b">実世界の観測・行動・失敗・介入データが蓄積する</text>
<rect x="12" y="187" width="376" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="207" font-size="12" text-anchor="middle" fill="#0b0b0b">世界モデル・能動的探索・継続学習と組み合わさる</text>
<rect x="12" y="244" width="376" height="31" rx="6" fill="#eef8f4" stroke="#1baf7a" stroke-width="1"/>
<text x="200" y="264" font-size="12" text-anchor="middle" fill="#0b0b0b">記号接地・因果理解・自己改善能力が補われる</text>
