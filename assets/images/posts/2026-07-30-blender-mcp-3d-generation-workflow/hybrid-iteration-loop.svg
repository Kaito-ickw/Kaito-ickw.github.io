<svg viewBox="0 0 400 565" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="loop-title loop-desc">
<title id="loop-title">生成→検査→修正→評価の反復ワークフロー</title>
<desc id="loop-desc">3D仕様書をもとにGeneratorが初期メッシュを作り、InspectorがBlender内から寸法やメッシュ統計を検査する。ActorがBlender MCP経由で局所修正を行い、レンダリング結果をVisual Criticが要件と比較し、Validatorが用途別の機械的な合格条件を確認したうえで人間が最終承認する。問題があればGeneratorまたはActorへ戻る。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
<rect x="0" y="0" width="400" height="565" rx="8" fill="#fcfcfb"/>
<rect x="12" y="16" width="344" height="31" rx="6" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1"/>
<text x="184" y="36" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">3D仕様書</text>
<rect x="12" y="87" width="344" height="46" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="184" y="107" font-size="12" text-anchor="middle" fill="#0b0b0b">Generator</text>
<text x="184" y="122" font-size="12" text-anchor="middle" fill="#0b0b0b">初期メッシュ生成</text>
<rect x="12" y="159" width="344" height="46" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="184" y="179" font-size="12" text-anchor="middle" fill="#0b0b0b">Inspector</text>
<text x="184" y="194" font-size="12" text-anchor="middle" fill="#0b0b0b">寸法・構造検査</text>
<rect x="12" y="245" width="344" height="46" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="184" y="265" font-size="12" text-anchor="middle" fill="#0b0b0b">Actor</text>
<text x="184" y="280" font-size="12" text-anchor="middle" fill="#0b0b0b">Blender MCPで修正</text>
<rect x="12" y="317" width="344" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="184" y="337" font-size="12" text-anchor="middle" fill="#0b0b0b">レンダリング</text>
<rect x="12" y="374" width="344" height="46" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="184" y="394" font-size="12" text-anchor="middle" fill="#0b0b0b">Visual Critic</text>
<text x="184" y="409" font-size="12" text-anchor="middle" fill="#0b0b0b">要件と画像を比較</text>
<rect x="12" y="446" width="344" height="46" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="184" y="466" font-size="12" text-anchor="middle" fill="#0b0b0b">Validator</text>
<text x="184" y="481" font-size="12" text-anchor="middle" fill="#0b0b0b">用途別の機械検査</text>
<rect x="12" y="518" width="344" height="31" rx="6" fill="#eef8f4" stroke="#1baf7a" stroke-width="1"/>
<text x="184" y="538" font-size="12" text-anchor="middle" fill="#0b0b0b">人間の最終承認</text>
