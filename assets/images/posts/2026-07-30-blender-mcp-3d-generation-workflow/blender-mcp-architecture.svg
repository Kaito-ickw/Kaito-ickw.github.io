<text x="200" y="140" font-size="10" text-anchor="middle" fill="#52514e">MCP</text>
<path d="M200,190 L200,224" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M196.4,224 L203.6,224 L200,230 Z" fill="#c3c2b7"/>
