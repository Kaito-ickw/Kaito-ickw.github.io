<svg viewBox="0 0 400 421" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-title arch-desc">
<title id="arch-title">Blender MCPの典型的な構成</title>
<desc id="arch-desc">ユーザーの自然言語指示をMCPクライアントが受け取り、MCPプロトコル経由でBlender MCP Serverへ送る。ServerはローカルのソケットでBlender Add-onと通信し、Add-onがBlenderのPython API（bpy）を呼び出してモデル作成・編集・レンダリング・出力を行う。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
<rect x="0" y="0" width="400" height="421" rx="8" fill="#fcfcfb"/>
<rect x="12" y="16" width="376" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="36" font-size="12" text-anchor="middle" fill="#0b0b0b">ユーザーの自然言語指示</text>
<rect x="12" y="73" width="376" height="46" rx="6" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1"/>
<text x="200" y="93" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">MCPクライアント</text>
<text x="200" y="108" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">(Claude / Cursor / Codex等)</text>
<rect x="12" y="159" width="376" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="179" font-size="12" text-anchor="middle" fill="#0b0b0b">Blender MCP Server</text>
<rect x="12" y="230" width="376" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="250" font-size="12" text-anchor="middle" fill="#0b0b0b">Blender Add-on</text>
<rect x="12" y="287" width="376" height="46" rx="6" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="307" font-size="12" text-anchor="middle" fill="#52514e">Blender Python API</text>
<text x="200" y="322" font-size="12" text-anchor="middle" fill="#52514e">(bpy)</text>
<rect x="12" y="359" width="376" height="46" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="379" font-size="12" text-anchor="middle" fill="#0b0b0b">モデル作成・編集・</text>
<text x="200" y="394" font-size="12" text-anchor="middle" fill="#0b0b0b">レンダリング・出力</text>
