<svg viewBox="0 0 400 441" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="results-title results-desc">
<title id="results-title">tools/callの結果が3つに分かれる</title>
<desc id="results-desc">initializeからversionとcapabilityの確認、notifications/initialized、tools/listでの発見を経てtools/callを実行する。結果は、成功のresult、プロトコルの問題を示すJSON-RPC error、Tool処理の失敗を示すresultとisErrorの3つに分かれる。</desc>
