<svg viewBox="0 0 1400 650" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pc-title pc-desc">
<title id="pc-title">Kimi K3・GPT-5.6 Sol・Claude Fable 5 の価格比較</title>
<desc id="pc-desc">入力・出力それぞれ$/1Mトークンの価格を3モデルで比較した横棒グラフ。Kimi K3は入力3ドル・出力15ドルで、Claude Fable 5の入力10ドル・出力50ドルの約1/3。出典: 各社公表の従量課金レート（2026年7月時点）。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
<rect x="0" y="0" width="1400" height="650" rx="12" fill="#fcfcfb"/>

<text x="40" y="50" font-size="26" font-weight="700" fill="#0b0b0b">価格（$/1Mトークン）</text>
<text x="40" y="80" font-size="15" fill="#52514e">Kimi K3の価格はClaude Fable 5の約1/3（入力 $3 vs $10、出力 $15 vs $50）</text>

<!-- legend -->
<rect x="40" y="105" width="14" height="14" rx="3" fill="#2a78d6"/>
<text x="62" y="116" font-size="14" font-weight="500" fill="#0b0b0b">Kimi K3</text>
<rect x="230" y="105" width="14" height="14" rx="3" fill="#eb6834"/>
<text x="252" y="116" font-size="14" font-weight="500" fill="#0b0b0b">GPT-5.6 Sol</text>
<rect x="460" y="105" width="14" height="14" rx="3" fill="#1baf7a"/>
<text x="482" y="116" font-size="14" font-weight="500" fill="#0b0b0b">Claude Fable 5</text>

