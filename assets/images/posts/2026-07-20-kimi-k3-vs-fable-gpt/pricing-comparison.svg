<text x="40" y="173" font-size="17" font-weight="600" fill="#52514e">入力（$/1Mトークン）</text>
<line x1="150" y1="185" x2="150" y2="321" stroke="#e1e0d9" stroke-width="1"/>
<line x1="536.4" y1="185" x2="536.4" y2="321" stroke="#e1e0d9" stroke-width="1"/>
<line x1="922.7" y1="185" x2="922.7" y2="321" stroke="#e1e0d9" stroke-width="1"/>
<text x="140" y="211" font-size="13" text-anchor="end" fill="#52514e">K3</text>
<path d="M150,195 L377.8,195 Q381.8,195 381.8,199 L381.8,215 Q381.8,219 377.8,219 L150,219 Z" fill="#2a78d6"/>
<text x="391.8" y="211" font-size="14" font-weight="600" fill="#0b0b0b">$3</text>
<text x="140" y="255" font-size="13" text-anchor="end" fill="#52514e">Sol</text>
<path d="M150,239 L532.4,239 Q536.4,239 536.4,243 L536.4,259 Q536.4,263 532.4,263 L150,263 Z" fill="#eb6834"/>
<text x="546.4" y="255" font-size="14" font-weight="600" fill="#0b0b0b">$5</text>
<text x="140" y="299" font-size="13" text-anchor="end" fill="#52514e">Fable 5</text>
<path d="M150,283 L918.7,283 Q922.7,283 922.7,287 L922.7,303 Q922.7,307 918.7,307 L150,307 Z" fill="#1baf7a"/>
<text x="932.7" y="299" font-size="14" font-weight="600" fill="#0b0b0b">$10</text>
<line x1="150" y1="321" x2="1000" y2="321" stroke="#c3c2b7" stroke-width="1"/>
<text x="150" y="337" font-size="12" text-anchor="middle" fill="#898781">0</text>
<text x="536.4" y="337" font-size="12" text-anchor="middle" fill="#898781">5</text>
<text x="922.7" y="337" font-size="12" text-anchor="middle" fill="#898781">10</text>

<!-- Panel B: 出力 -->
<text x="40" y="405" font-size="17" font-weight="600" fill="#52514e">出力（$/1Mトークン）</text>
<line x1="150" y1="417" x2="150" y2="553" stroke="#e1e0d9" stroke-width="1"/>
<line x1="536.4" y1="417" x2="536.4" y2="553" stroke="#e1e0d9" stroke-width="1"/>
<line x1="922.7" y1="417" x2="922.7" y2="553" stroke="#e1e0d9" stroke-width="1"/>
<text x="140" y="443" font-size="13" text-anchor="end" fill="#52514e">K3</text>
<path d="M150,427 L377.8,427 Q381.8,427 381.8,431 L381.8,447 Q381.8,451 377.8,451 L150,451 Z" fill="#2a78d6"/>
<text x="391.8" y="443" font-size="14" font-weight="600" fill="#0b0b0b">$15</text>
