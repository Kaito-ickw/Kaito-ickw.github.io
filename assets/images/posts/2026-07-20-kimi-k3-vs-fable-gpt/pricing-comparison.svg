<path d="M150,515 L918.7,515 Q922.7,515 922.7,519 L922.7,535 Q922.7,539 918.7,539 L150,539 Z" fill="#1baf7a"/>
<text x="932.7" y="531" font-size="14" font-weight="600" fill="#0b0b0b">$50</text>
<line x1="150" y1="553" x2="1000" y2="553" stroke="#c3c2b7" stroke-width="1"/>
<text x="150" y="569" font-size="12" text-anchor="middle" fill="#898781">0</text>
<text x="536.4" y="569" font-size="12" text-anchor="middle" fill="#898781">25</text>
<text x="922.7" y="569" font-size="12" text-anchor="middle" fill="#898781">50</text>

<text x="40" y="609" font-size="12" fill="#898781">出典: 各社公表の従量課金レート（2026年7月時点）</text>
