<svg viewBox="0 0 1400 880" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bc-title bc-desc">
<title id="bc-title">Kimi K3・GPT-5.6 Sol・Claude Fable 5 のベンチマーク比較</title>
<desc id="bc-desc">AA Intelligence Index、FrontierSWE、GDPval v2の3指標で3モデルを比較した横棒グラフ。AA Intelligence IndexはClaude Fable 5が最高、FrontierSWEはKimi K3が僅差で最高、GDPval v2はKimi K3とClaude Fable 5の差が92ポイントで最大。GDPval v2はGPT-5.6 Solのデータなし。出典: Artificial Analysis、各社公表値（2026年7月時点）。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
<rect x="0" y="0" width="1400" height="880" rx="12" fill="#fcfcfb"/>

<text x="40" y="55" font-size="26" font-weight="700" fill="#0b0b0b">ベンチマークで見る位置づけ</text>

<!-- legend -->
<rect x="40" y="90" width="14" height="14" rx="3" fill="#2a78d6"/>
<text x="62" y="101" font-size="14" font-weight="500" fill="#0b0b0b">Kimi K3</text>
<rect x="230" y="90" width="14" height="14" rx="3" fill="#eb6834"/>
<text x="252" y="101" font-size="14" font-weight="500" fill="#0b0b0b">GPT-5.6 Sol</text>
<rect x="460" y="90" width="14" height="14" rx="3" fill="#1baf7a"/>
<text x="482" y="101" font-size="14" font-weight="500" fill="#0b0b0b">Claude Fable 5</text>

