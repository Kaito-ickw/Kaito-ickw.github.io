<svg viewBox="0 0 400 393" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipe2-title pipe2-desc">
<title id="pipe2-title">記事作成パイプラインの後半</title>
<desc id="pipe2-desc">Jekyllのビルドが失敗したらAgent loopが自動修正してビルドへ戻る。成功したらルールとLLMで品質を評価し、不合格なら自動修正へ戻す。合格したらGitHub APIでPRを作り、人間のレビューと承認へ渡す。</desc>
