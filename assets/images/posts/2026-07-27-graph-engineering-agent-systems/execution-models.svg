<svg viewBox="0 0 400 262" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="models-title models-desc">
<title id="models-title">既存の実行モデルとGraph Engineeringの関係</title>
<desc id="models-desc">有限状態機械やStatechart、DAGとワークフローエンジン、Durable Execution、Actor modelやEvent-drivenといった決定的な実行モデルの延長に、ノードの一部にAgent loopを含むGraph Engineeringがある。そこでは停止条件・冪等性・評価・権限・コストが新たに重要になる。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
<rect x="0" y="0" width="400" height="262" rx="8" fill="#fcfcfb"/>
<rect x="12" y="16" width="376" height="96" rx="8" fill="none" stroke="#e1e0d9" stroke-width="1"/>
<text x="22" y="30" font-size="13" font-weight="600" fill="#52514e">決定的な実行モデル</text>
<rect x="28.5" y="42" width="166.7" height="26" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="111.9" y="59" font-size="11" text-anchor="middle" fill="#0b0b0b">有限状態機械 / Statechart</text>
<rect x="203.2" y="42" width="168.3" height="26" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="287.3" y="59" font-size="11" text-anchor="middle" fill="#0b0b0b">DAG / ワークフローエンジン</text>
<rect x="43.9" y="76" width="124.8" height="26" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="106.3" y="93" font-size="11" text-anchor="middle" fill="#0b0b0b">Durable Execution</text>
<rect x="176.8" y="76" width="179.3" height="26" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="266.4" y="93" font-size="11" text-anchor="middle" fill="#0b0b0b">Actor model / Event-driven</text>
<rect x="12" y="128" width="376" height="46" rx="6" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1"/>
<text x="200" y="148" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">Graph Engineering</text>
<text x="200" y="163" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">ノードの一部にAgent loopを含む</text>
<rect x="12" y="200" width="376" height="46" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="220" font-size="12" text-anchor="middle" fill="#0b0b0b">新たに重要になる観点</text>
<text x="200" y="235" font-size="12" text-anchor="middle" fill="#0b0b0b">停止条件・冪等性・評価・権限・コスト</text>
<path d="M200,174 L200,194" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M196.4,194 L203.6,194 L200,200 Z" fill="#c3c2b7"/>
</svg>
