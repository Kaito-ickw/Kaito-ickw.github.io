<svg viewBox="0 0 400 324" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gtypes-title gtypes-desc">
<title id="gtypes-title">実行グラフとKnowledge Graphの違い</title>
<desc id="gtypes-desc">実行グラフはIssue取得・調査・分岐・公開のように手順が一列につながり、ノードを辿って処理を進める。Knowledge GraphやGraphRAGは、Claude CodeがGitHubをuses、GitHubがPull Requestをproduces、Claude CodeがCLAUDE.mdにconstrained_byという関係で結ばれる意味構造であり、辿るというより問い合わせて使う。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
