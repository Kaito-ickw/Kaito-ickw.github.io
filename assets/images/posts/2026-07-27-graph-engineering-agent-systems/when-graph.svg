<svg viewBox="0 0 400 313" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="when-title when-desc">
<title id="when-title">Graph Engineeringとして設計するかの判断</title>
<desc id="when-desc">分岐・再試行・中断再開がなければ通常コードのままでよい。あるなら、複数のツールや複数のAgent loopがあるかを見る。なければLoop / Harness Engineeringで足りる。あるなら、人間承認・監査・コストや権限の制御が必要かを見て、必要ならGraph Engineeringとして設計する。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
<rect x="0" y="0" width="400" height="313" rx="8" fill="#fcfcfb"/>
<polygon points="25,16 375,16 388,35 375,54 25,54 12,35" fill="#fcfaf4" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="39.5" font-size="12" text-anchor="middle" fill="#0b0b0b">分岐・再試行・中断再開があるか</text>
<rect x="12" y="101.5" width="182" height="31" rx="6" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="103" y="121.5" font-size="12" text-anchor="middle" fill="#52514e">通常コードのままでよい</text>
<polygon points="219,94 375,94 388,117 375,140 219,140 206,117" fill="#fcfaf4" stroke="#c3c2b7" stroke-width="1"/>
<text x="297" y="114" font-size="12" text-anchor="middle" fill="#0b0b0b">複数のツール・複数のAgent</text>
<text x="297" y="129" font-size="12" text-anchor="middle" fill="#0b0b0b">loopがあるか</text>
<rect x="12" y="180" width="182" height="46" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="103" y="200" font-size="12" text-anchor="middle" fill="#0b0b0b">Loop / Harness</text>
<text x="103" y="215" font-size="12" text-anchor="middle" fill="#0b0b0b">Engineeringで足りる</text>
<polygon points="219,180 375,180 388,203 375,226 219,226 206,203" fill="#fcfaf4" stroke="#c3c2b7" stroke-width="1"/>
<text x="297" y="200" font-size="12" text-anchor="middle" fill="#0b0b0b">人間承認・監査・コストや権</text>
<text x="297" y="215" font-size="12" text-anchor="middle" fill="#0b0b0b">限の制御が必要か</text>
<rect x="12" y="266" width="376" height="31" rx="6" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1"/>
<text x="200" y="286" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">Graph Engineeringとして設計する</text>
