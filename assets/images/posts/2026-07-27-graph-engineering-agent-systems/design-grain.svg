<svg viewBox="0 0 400 266" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="grain-title grain-desc">
<title id="grain-title">設計する粒度の入れ子関係</title>
<desc id="grain-desc">Prompt Engineeringを最も内側に、Context Engineering、Loop / Harness Engineering、Graph Engineeringの順で外側へ入れ子になる。外側が内側を置き換えるのではなく内包する関係にある。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
<rect x="0" y="0" width="400" height="266" rx="8" fill="#fcfcfb"/>
<rect x="12" y="16" width="376" height="166" rx="8" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.2"/>
<text x="22" y="33" font-size="11" font-weight="700" fill="#0b0b0b">Graph Engineering</text>
<rect x="27" y="46" width="346" height="122" rx="8" fill="#eef8f4" stroke="#1baf7a" stroke-width="1.2"/>
<text x="37" y="63" font-size="11" font-weight="700" fill="#0b0b0b">Loop / Harness Engineering</text>
<rect x="42" y="76" width="316" height="78" rx="8" fill="#fdf1eb" stroke="#eb6834" stroke-width="1.2"/>
<text x="52" y="93" font-size="11" font-weight="700" fill="#0b0b0b">Context Engineering</text>
<rect x="57" y="106" width="286" height="34" rx="8" fill="#f2f1ee" stroke="#898781" stroke-width="1.2"/>
<text x="67" y="123" font-size="11" font-weight="700" fill="#0b0b0b">Prompt Engineering</text>
<rect x="12" y="193" width="10" height="10" rx="2" fill="#2a78d6"/>
<text x="28" y="202" font-size="10" fill="#52514e">Graph Engineering：複数loop・通常コード・人間・評価</text>
<rect x="12" y="208" width="10" height="10" rx="2" fill="#1baf7a"/>
<text x="28" y="217" font-size="10" fill="#52514e">Loop / Harness Engineering：1つのAgent loopの安定動作</text>
<rect x="12" y="223" width="10" height="10" rx="2" fill="#eb6834"/>
<text x="28" y="232" font-size="10" fill="#52514e">Context Engineering：入力に添える情報</text>
<rect x="12" y="238" width="10" height="10" rx="2" fill="#898781"/>
<text x="28" y="247" font-size="10" fill="#52514e">Prompt Engineering：1回の入力</text>
</svg>
