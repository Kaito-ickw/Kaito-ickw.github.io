<svg viewBox="0 0 400 502" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wfag-title wfag-desc">
<title id="wfag-title">WorkflowとAgentの違い</title>
<desc id="wfag-desc">Workflowは事前定義したコードパスの上でLLMを呼び、次のステップも固定されている。Agentは目的とツールを渡し、LLMが次の行動を決め、完了したかを判定して未完了なら決定へ戻る。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
<rect x="0" y="0" width="400" height="502" rx="8" fill="#fcfcfb"/>
<rect x="12" y="16" width="376" height="181" rx="8" fill="none" stroke="#e1e0d9" stroke-width="1"/>
<text x="22" y="30" font-size="13" font-weight="600" fill="#52514e">Workflow</text>
<rect x="22" y="42" width="356" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="62" font-size="12" text-anchor="middle" fill="#0b0b0b">事前定義したコードパス</text>
<rect x="22" y="99" width="356" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="119" font-size="12" text-anchor="middle" fill="#0b0b0b">LLM呼び出し</text>
<rect x="22" y="156" width="356" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="176" font-size="12" text-anchor="middle" fill="#0b0b0b">次のステップも固定</text>
<path d="M200,73 L200,93" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M196.4,93 L203.6,93 L200,99 Z" fill="#c3c2b7"/>
<path d="M200,130 L200,150" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M196.4,150 L203.6,150 L200,156 Z" fill="#c3c2b7"/>
<rect x="12" y="213" width="376" height="273" rx="8" fill="none" stroke="#e1e0d9" stroke-width="1"/>
<text x="22" y="227" font-size="13" font-weight="600" fill="#52514e">Agent</text>
<rect x="22" y="239" width="340" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="192" y="259" font-size="12" text-anchor="middle" fill="#0b0b0b">目的とツールを渡す</text>
<rect x="22" y="310" width="340" height="31" rx="6" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1"/>
<text x="192" y="330" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">LLMが次の行動を決定</text>
<polygon points="35,367 349,367 362,386 349,405 35,405 22,386" fill="#fcfaf4" stroke="#c3c2b7" stroke-width="1"/>
<text x="192" y="390.5" font-size="12" text-anchor="middle" fill="#0b0b0b">完了したか</text>
<rect x="22" y="445" width="340" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="192" y="465" font-size="12" text-anchor="middle" fill="#0b0b0b">終了</text>
<path d="M192,270 L192,304" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M188.4,304 L195.6,304 L192,310 Z" fill="#c3c2b7"/>
<path d="M192,341 L192,361" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M188.4,361 L195.6,361 L192,367 Z" fill="#c3c2b7"/>
<path d="M192,405 L192,439" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M188.4,439 L195.6,439 L192,445 Z" fill="#c3c2b7"/>
<rect x="178" y="416" width="28" height="13" rx="3" fill="#fcfcfb" opacity="0.95"/>
<text x="192" y="426" font-size="10" text-anchor="middle" fill="#52514e">はい</text>
<path d="M362,386 L366,386 Q373,386 373,379 L373,332.5 Q373,325.5 366,325.5 L368,325.5" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M368,321.9 L368,329.1 L362,325.5 Z" fill="#c3c2b7"/>
<rect x="335" y="346.8" width="38" height="13" rx="3" fill="#fcfcfb" opacity="0.95"/>
<text x="369" y="356.8" font-size="10" text-anchor="end" fill="#52514e">いいえ</text>
</svg>
