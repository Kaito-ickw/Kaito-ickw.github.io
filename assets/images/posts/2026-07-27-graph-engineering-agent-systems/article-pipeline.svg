<svg viewBox="0 0 400 436" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipe-title pipe-desc">
<title id="pipe-title">記事作成パイプラインの前半</title>
<desc id="pipe-desc">Issueが作られると通常コードがIssueを解析し、LLMかルールで依頼タイプを分類する。調査が要らなければそのまま構成作成へ進み、必要ならAgent loopがWeb調査をしてから構成作成へ合流する。構成ができたら通常コードで記事を作成する。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
<rect x="0" y="0" width="400" height="436" rx="8" fill="#fcfcfb"/>
