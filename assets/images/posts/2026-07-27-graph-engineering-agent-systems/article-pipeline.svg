<text x="192" y="36" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">Issue作成</text>
<rect x="12" y="73" width="360" height="46" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="192" y="93" font-size="12" text-anchor="middle" fill="#0b0b0b">Issue解析</text>
<text x="192" y="108" font-size="12" text-anchor="middle" fill="#0b0b0b">通常コード</text>
