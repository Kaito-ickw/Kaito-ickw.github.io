<text x="192" y="251" font-size="12" text-anchor="middle" fill="#0b0b0b">Web調査</text>
<text x="192" y="266" font-size="12" text-anchor="middle" fill="#0b0b0b">Agent loop</text>
<rect x="12" y="317" width="360" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="192" y="337" font-size="12" text-anchor="middle" fill="#0b0b0b">構成作成</text>
