<svg viewBox="0 0 400 335" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hcs-title hcs-desc">
<title id="hcs-title">1つのHostが複数のServerを持つときの構成</title>
<desc id="hcs-desc">MCP HostはLLMと、Serverごとに1つずつのMCP Clientを持つ。Client AはファイルシステムをServer A経由で、Client BはGitHubなどの外部APIをServer B経由で扱う。ClientとServerは1対1の専用接続で結ばれる。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
<rect x="0" y="0" width="400" height="335" rx="8" fill="#fcfcfb"/>
<rect x="12" y="16" width="376" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="36" font-size="12" text-anchor="middle" fill="#0b0b0b">ユーザー</text>
<rect x="12" y="73" width="182" height="46" rx="6" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1"/>
<text x="103" y="93" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">MCP Host</text>
<text x="103" y="108" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">AIアプリケーション</text>
<rect x="206" y="80.5" width="182" height="31" rx="6" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="297" y="100.5" font-size="12" text-anchor="middle" fill="#52514e">LLM</text>
