<rect x="206" y="145" width="182" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="297" y="165" font-size="12" text-anchor="middle" fill="#0b0b0b">MCP Client B</text>
<rect x="12" y="216" width="182" height="46" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="103" y="236" font-size="12" text-anchor="middle" fill="#0b0b0b">MCP Server A</text>
<text x="103" y="251" font-size="12" text-anchor="middle" fill="#0b0b0b">ファイル操作</text>
