<svg viewBox="0 0 400 638" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="secflow-title secflow-desc">
<title id="secflow-title">外部から来た文字列がモデルへ届くまで</title>
<desc id="secflow-desc">ユーザーの操作はMCP HostからMCP Client、MCP Serverを経て外部API・DB・ファイルへ届く。逆向きに、Tool結果やResource、外部文書がServerへ入り、Clientを通じてモデルへ返る。この戻りの経路に外部が書いた文字列が乗るため、指示として解釈させない扱いが要る。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
