<svg viewBox="0 0 400 336" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="beta-title beta-desc">
<title id="beta-title">5回中4勝と100回中60勝の事後分布の比較</title>
<desc id="beta-desc">一様事前分布からベイズ更新した本当の勝率の事後分布を重ねた図。5回中4勝のBeta(5,2)は平均71%で幅広く平たい山になり、100回中60勝のBeta(61,41)は平均60%で鋭く尖った山になる。標本が少ないほど推定が定まらないことを示す。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
<rect x="0" y="0" width="400" height="336" rx="8" fill="#fcfcfb"/>
<text x="12" y="24" font-size="17" font-weight="700" fill="#0b0b0b">本当の勝率の事後分布</text>
<text x="12" y="44" font-size="12" fill="#52514e">標本が少ないほど山は平たく広がり、</text>
<text x="12" y="60" font-size="12" fill="#52514e">推定値は中央へ引き戻される。</text>
<rect x="12" y="75" width="10" height="10" rx="2" fill="#2a78d6"/>
<text x="28" y="84" font-size="12" fill="#0b0b0b">5回中4勝 → Beta(5, 2)</text>
<rect x="12" y="92" width="10" height="10" rx="2" fill="#eb6834"/>
<text x="28" y="101" font-size="12" fill="#0b0b0b">100回中60勝 → Beta(61, 41)</text>
