<svg viewBox="0 0 400 177" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="notionmodel-title notionmodel-desc">
<title id="notionmodel-title">Notionデータベースの構造</title>
<desc id="notionmodel-desc">データベースはコンテナであり、その中のデータソースが表そのものにあたる。データソースは、1行のレコードにあたるページと、カラムにあたるプロパティを持つ。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
<rect x="0" y="0" width="400" height="177" rx="8" fill="#fcfcfb"/>
<rect x="12" y="16" width="376" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="36" font-size="12" text-anchor="middle" fill="#0b0b0b">データベース（コンテナ）</text>
<rect x="12" y="73" width="376" height="31" rx="6" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1"/>
<text x="200" y="93" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">データソース（表そのもの）</text>
<rect x="12" y="130" width="182" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="103" y="150" font-size="12" text-anchor="middle" fill="#0b0b0b">ページ = 1行のレコード</text>
<rect x="206" y="130" width="182" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="297" y="150" font-size="12" text-anchor="middle" fill="#0b0b0b">プロパティ = カラム</text>
<path d="M200,47 L200,67" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M196.4,67 L203.6,67 L200,73 Z" fill="#c3c2b7"/>
<path d="M200,104 L200,110 Q200,117 193,117 L110,117 Q103,117 103,124 L103,124" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M99.4,124 L106.6,124 L103,130 Z" fill="#c3c2b7"/>
<path d="M200,104 L200,110 Q200,117 207,117 L290,117 Q297,117 297,124 L297,124" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M293.4,124 L300.6,124 L297,130 Z" fill="#c3c2b7"/>
</svg>
