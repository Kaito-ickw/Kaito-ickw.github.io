<svg viewBox="0 0 400 262" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cliprims-title cliprims-desc">
<title id="cliprims-title">MCP Clientが提供する3つのprimitive</title>
<desc id="cliprims-desc">MCP ClientはRootsで対象ディレクトリを公開し、Samplingでモデル利用を仲介し、Elicitationでユーザー操作を仲介する。Server側はroots/list・sampling/createMessage・elicitation/createで呼び出す。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
<rect x="0" y="0" width="400" height="262" rx="8" fill="#fcfcfb"/>
<rect x="12" y="16" width="376" height="31" rx="6" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1"/>
<text x="200" y="36" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">MCP Client</text>
<rect x="12" y="73" width="117.3" height="61" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="70.7" y="93" font-size="12" text-anchor="middle" fill="#0b0b0b">Roots</text>
<text x="70.7" y="108" font-size="12" text-anchor="middle" fill="#0b0b0b">対象ディレクトリ</text>
<text x="70.7" y="123" font-size="12" text-anchor="middle" fill="#0b0b0b">公開・提供</text>
<rect x="141.3" y="73" width="117.3" height="61" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="93" font-size="12" text-anchor="middle" fill="#0b0b0b">Sampling</text>
<text x="200" y="108" font-size="12" text-anchor="middle" fill="#0b0b0b">LLM生成</text>
<text x="200" y="123" font-size="12" text-anchor="middle" fill="#0b0b0b">モデル利用を仲介</text>
<rect x="270.7" y="73" width="117.3" height="61" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="329.3" y="93" font-size="12" text-anchor="middle" fill="#0b0b0b">Elicitation</text>
<text x="329.3" y="108" font-size="12" text-anchor="middle" fill="#0b0b0b">追加情報</text>
<text x="329.3" y="123" font-size="12" text-anchor="middle" fill="#0b0b0b">操作を仲介</text>
<path d="M200,47 L200,53 Q200,60 193,60 L77.7,60 Q70.7,60 70.7,67 L70.7,67" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
