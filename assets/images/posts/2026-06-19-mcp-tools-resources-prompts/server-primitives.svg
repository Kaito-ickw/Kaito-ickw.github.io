<svg viewBox="0 0 400 247" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="prims-title prims-desc">
<title id="prims-title">MCP Serverが公開する3つのprimitive</title>
<desc id="prims-desc">MCP ServerはTools・Resources・Promptsの3つを公開する。Toolsは実行可能な機能でModelが選び、Resourcesは参照するデータでApplicationが文脈を管理し、Promptsは再利用する指示でUserが明示的に選ぶ。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
<rect x="0" y="0" width="400" height="247" rx="8" fill="#fcfcfb"/>
<rect x="12" y="16" width="376" height="31" rx="6" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1"/>
<text x="200" y="36" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">MCP Server</text>
<rect x="12" y="73" width="117.3" height="46" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="70.7" y="93" font-size="12" text-anchor="middle" fill="#0b0b0b">Tools</text>
<text x="70.7" y="108" font-size="12" text-anchor="middle" fill="#0b0b0b">実行可能な機能</text>
<rect x="141.3" y="73" width="117.3" height="46" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="93" font-size="12" text-anchor="middle" fill="#0b0b0b">Resources</text>
<text x="200" y="108" font-size="12" text-anchor="middle" fill="#0b0b0b">参照するデータ</text>
<rect x="270.7" y="73" width="117.3" height="46" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="329.3" y="93" font-size="12" text-anchor="middle" fill="#0b0b0b">Prompts</text>
<text x="329.3" y="108" font-size="12" text-anchor="middle" fill="#0b0b0b">再利用する指示</text>
<path d="M200,47 L200,53 Q200,60 193,60 L77.7,60 Q70.7,60 70.7,67 L70.7,67" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M67.1,67 L74.3,67 L70.7,73 Z" fill="#c3c2b7"/>
<path d="M200,47 L200,67" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M196.4,67 L203.6,67 L200,73 Z" fill="#c3c2b7"/>
<path d="M200,47 L200,53 Q200,60 207,60 L322.3,60 Q329.3,60 329.3,67 L329.3,67" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M325.7,67 L332.9,67 L329.3,73 Z" fill="#c3c2b7"/>
<rect x="12" y="135" width="376" height="96" rx="8" fill="none" stroke="#e1e0d9" stroke-width="1"/>
<text x="22" y="149" font-size="13" font-weight="600" fill="#52514e">選ぶ主体</text>
<rect x="65.1" y="161" width="100.6" height="26" rx="6" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="115.4" y="178" font-size="11" text-anchor="middle" fill="#52514e">Tools → Model</text>
<rect x="173.7" y="161" width="161.2" height="26" rx="6" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="254.3" y="178" font-size="11" text-anchor="middle" fill="#52514e">Resources → Application</text>
<rect x="146.7" y="195" width="106.7" height="26" rx="6" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="212" font-size="11" text-anchor="middle" fill="#52514e">Prompts → User</text>
</svg>
