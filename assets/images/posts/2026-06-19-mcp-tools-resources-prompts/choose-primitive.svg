<svg viewBox="0 0 400 354" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="choose-title choose-desc">
<title id="choose-title">どのprimitiveで公開するかの決め方</title>
<desc id="choose-desc">処理や副作用があるならTool。ないなら、既存データの参照であればResource。それも違い、ユーザーが選ぶ対話手順ならPrompt。いずれにも当てはまらない場合は、要件と操作主体を再確認する。</desc>
