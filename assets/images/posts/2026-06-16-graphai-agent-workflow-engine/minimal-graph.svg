<svg viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="graphai-title graphai-desc">
<title id="graphai-title">GraphAIの最小構成</title>
<desc id="graphai-desc">llmノードがopenAIAgentで生成し、その結果をoutputノードのcopyAgentが受け取る、2ノードだけのグラフ。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
<rect x="0" y="0" width="400" height="150" rx="8" fill="#fcfcfb"/>
<rect x="12" y="16" width="376" height="46" rx="6" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1"/>
<text x="200" y="36" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">llm</text>
<text x="200" y="51" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">openAIAgent</text>
<rect x="12" y="88" width="376" height="46" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="108" font-size="12" text-anchor="middle" fill="#0b0b0b">output</text>
<text x="200" y="123" font-size="12" text-anchor="middle" fill="#0b0b0b">copyAgent</text>
<path d="M200,62 L200,82" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M196.4,82 L203.6,82 L200,88 Z" fill="#c3c2b7"/>
</svg>
