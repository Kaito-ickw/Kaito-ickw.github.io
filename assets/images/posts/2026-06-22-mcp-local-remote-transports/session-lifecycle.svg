<svg viewBox="0 0 400 291" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="session-title session-desc">
<title id="session-title">MCP-Session-Idの寿命</title>
<desc id="session-desc">initializeでMCP-Session-Idを受け取り、後続のPOSTとGETで使う。DELETEかServer側の終了でセッションが終わる。セッションが失われると404 Not Foundが返り、新しいinitializeからやり直す。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
<rect x="0" y="0" width="400" height="291" rx="8" fill="#fcfcfb"/>
<rect x="12" y="16" width="376" height="31" rx="6" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1"/>
<text x="200" y="36" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">initialize</text>
<rect x="12" y="73" width="376" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="93" font-size="12" text-anchor="middle" fill="#0b0b0b">MCP-Session-Idを受領</text>
<rect x="12" y="130" width="376" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="150" font-size="12" text-anchor="middle" fill="#0b0b0b">後続のPOST / GET</text>
<rect x="12" y="187" width="182" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="103" y="207" font-size="12" text-anchor="middle" fill="#0b0b0b">DELETEまたはServer側で終了</text>
<rect x="206" y="187" width="182" height="31" rx="6" fill="#fdf1eb" stroke="#eb6834" stroke-width="1"/>
<text x="297" y="207" font-size="12" text-anchor="middle" fill="#0b0b0b">404 Not Found</text>
<rect x="12" y="244" width="376" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="264" font-size="12" text-anchor="middle" fill="#0b0b0b">新しいinitialize</text>
