<svg viewBox="0 0 400 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="trust-title trust-desc">
<title id="trust-title">stdioとStreamable HTTPで信頼の境界が変わる</title>
<desc id="trust-desc">stdioでは、Host / Clientと環境・OSの資格情報がそのままServer子プロセスへ渡る。Streamable HTTPでは、MCP ClientがAuthorization Serverと認可をやり取りし、取得したBearer tokenでMCP Resource Serverへアクセスする。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
<rect x="0" y="0" width="400" height="310" rx="8" fill="#fcfcfb"/>
<rect x="12" y="16" width="376" height="124" rx="8" fill="none" stroke="#e1e0d9" stroke-width="1"/>
<text x="22" y="30" font-size="13" font-weight="600" fill="#52514e">stdio</text>
<rect x="22" y="42" width="172" height="31" rx="6" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1"/>
<text x="108" y="62" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">Host / Client</text>
<rect x="206" y="42" width="172" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="292" y="62" font-size="12" text-anchor="middle" fill="#0b0b0b">環境・OSの資格情報</text>
<rect x="22" y="99" width="356" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="119" font-size="12" text-anchor="middle" fill="#0b0b0b">Server子プロセス</text>
<path d="M108,73 L108,79 Q108,86 115,86 L193,86 Q200,86 200,93 L200,93" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M196.4,93 L203.6,93 L200,99 Z" fill="#c3c2b7"/>
<path d="M292,73 L292,79 Q292,86 285,86 L207,86 Q200,86 200,93 L200,93" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M196.4,93 L203.6,93 L200,99 Z" fill="#c3c2b7"/>
<rect x="12" y="156" width="376" height="138" rx="8" fill="none" stroke="#e1e0d9" stroke-width="1"/>
<text x="22" y="170" font-size="13" font-weight="600" fill="#52514e">Streamable HTTP</text>
<rect x="22" y="182" width="356" height="31" rx="6" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1"/>
<text x="200" y="202" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">MCP Client</text>
<rect x="22" y="253" width="172" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="108" y="273" font-size="12" text-anchor="middle" fill="#0b0b0b">Authorization Server</text>
<rect x="206" y="253" width="172" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="292" y="273" font-size="12" text-anchor="middle" fill="#0b0b0b">MCP Resource Server</text>
<path d="M200,213 L200,226 Q200,233 193,233 L115,233 Q108,233 108,240 L108,247" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M104.4,247 L111.6,247 L108,253 Z" fill="#c3c2b7"/>
<path d="M196.4,219 L203.6,219 L200,213 Z" fill="#c3c2b7"/>
<rect x="140" y="224" width="28" height="13" rx="3" fill="#fcfcfb" opacity="0.95"/>
<text x="154" y="234" font-size="10" text-anchor="middle" fill="#52514e">認可</text>
<path d="M200,213 L200,226 Q200,233 207,233 L285,233 Q292,233 292,240 L292,247" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M288.4,247 L295.6,247 L292,253 Z" fill="#c3c2b7"/>
<rect x="209" y="224" width="74" height="13" rx="3" fill="#fcfcfb" opacity="0.95"/>
<text x="246" y="234" font-size="10" text-anchor="middle" fill="#52514e">Bearer token</text>
</svg>
