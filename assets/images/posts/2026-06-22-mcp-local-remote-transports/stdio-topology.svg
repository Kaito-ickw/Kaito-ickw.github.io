<svg viewBox="0 0 400 262" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="stdiotop-title stdiotop-desc">
<title id="stdiotop-title">stdioでつなぐときの構成</title>
<desc id="stdiotop-desc">MCP HostがMCP Clientを持ち、ClientがServerを子プロセスとして起動・停止する。Clientはstdinへ書き、Serverはstdoutで返す。Server子プロセスの先にローカルのToolやデータがある。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
<rect x="0" y="0" width="400" height="262" rx="8" fill="#fcfcfb"/>
<rect x="12" y="16" width="360" height="31" rx="6" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1"/>
<text x="192" y="36" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">MCP Host</text>
<rect x="12" y="87" width="360" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="192" y="107" font-size="12" text-anchor="middle" fill="#0b0b0b">MCP Client</text>
<rect x="12" y="158" width="360" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="192" y="178" font-size="12" text-anchor="middle" fill="#0b0b0b">Server子プロセス</text>
<rect x="12" y="215" width="360" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="192" y="235" font-size="12" text-anchor="middle" fill="#0b0b0b">ローカルTool / Data</text>
<path d="M192,47 L192,81" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M188.4,81 L195.6,81 L192,87 Z" fill="#c3c2b7"/>
<path d="M192,118 L192,152" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M188.4,152 L195.6,152 L192,158 Z" fill="#c3c2b7"/>
<rect x="141" y="129" width="102" height="13" rx="3" fill="#fcfcfb" opacity="0.95"/>
<text x="192" y="139" font-size="10" text-anchor="middle" fill="#52514e">起動・停止 / stdin</text>
<path d="M192,189 L192,209" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
