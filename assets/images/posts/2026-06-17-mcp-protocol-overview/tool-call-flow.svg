<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mcptool-title mcptool-desc">
<title id="mcptool-title">Tool呼び出しで3者がやり取りする順</title>
<desc id="mcptool-desc">MCP ServerがHostへtools/listでTool定義を渡し、HostがそれをLLMへ渡す。LLMがTool使用を提案するとHostがServerへtools/callを送り、返ってきたTool結果をHostがLLMへ渡す。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
<rect x="0" y="0" width="400" height="260" rx="8" fill="#fcfcfb"/>
<line x1="74.7" y1="40" x2="74.7" y2="248" stroke="#e1e0d9" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="200" y1="40" x2="200" y2="248" stroke="#e1e0d9" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="325.3" y1="40" x2="325.3" y2="248" stroke="#e1e0d9" stroke-width="1" stroke-dasharray="3 4"/>
<rect x="19.7" y="14" width="110" height="26" rx="6" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1"/>
<text x="74.7" y="31" font-size="11" font-weight="600" text-anchor="middle" fill="#0b0b0b">MCP Server</text>
<rect x="145" y="14" width="110" height="26" rx="6" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1"/>
<text x="200" y="31" font-size="11" font-weight="600" text-anchor="middle" fill="#0b0b0b">MCP Host</text>
<rect x="270.3" y="14" width="110" height="26" rx="6" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1"/>
<text x="325.3" y="31" font-size="11" font-weight="600" text-anchor="middle" fill="#0b0b0b">LLM</text>
<text x="137.3" y="57" font-size="10" text-anchor="middle" fill="#52514e">tools/list</text>
<path d="M74.7,64 L194,64" stroke="#52514e" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M194,60.4 L194,67.6 L200,64 Z" fill="#52514e"/>
<text x="262.7" y="91" font-size="10" text-anchor="middle" fill="#52514e">Tool定義を渡す</text>
<path d="M200,98 L319.3,98" stroke="#52514e" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M319.3,94.4 L319.3,101.6 L325.3,98 Z" fill="#52514e"/>
<text x="262.7" y="125" font-size="10" text-anchor="middle" fill="#52514e">Tool使用を提案</text>
<path d="M325.3,132 L206,132" stroke="#898781" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-dasharray="4 3"/>
<path d="M206,128.4 L206,135.6 L200,132 Z" fill="#898781"/>
<text x="137.3" y="159" font-size="10" text-anchor="middle" fill="#52514e">tools/call</text>
<path d="M200,166 L80.7,166" stroke="#52514e" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M80.7,162.4 L80.7,169.6 L74.7,166 Z" fill="#52514e"/>
<text x="137.3" y="193" font-size="10" text-anchor="middle" fill="#52514e">Tool結果</text>
<path d="M74.7,200 L194,200" stroke="#898781" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-dasharray="4 3"/>
<path d="M194,196.4 L194,203.6 L200,200 Z" fill="#898781"/>
<text x="262.7" y="227" font-size="10" text-anchor="middle" fill="#52514e">結果を渡す</text>
<path d="M200,234 L319.3,234" stroke="#52514e" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M319.3,230.4 L319.3,237.6 L325.3,234 Z" fill="#52514e"/>
</svg>
