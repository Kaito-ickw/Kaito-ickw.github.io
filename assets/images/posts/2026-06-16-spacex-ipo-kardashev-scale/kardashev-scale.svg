<svg viewBox="0 0 400 222" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kardashev-title kardashev-desc">
<title id="kardashev-title">カルダシェフ・スケールの3段階</title>
<desc id="kardashev-desc">Type Iは惑星に届く太陽エネルギーを使い切る段階、Type IIは恒星のエネルギーを丸ごと使う段階、Type IIIは銀河系規模のエネルギーを使う段階。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
<rect x="0" y="0" width="400" height="222" rx="8" fill="#fcfcfb"/>
<rect x="12" y="16" width="376" height="46" rx="6" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1"/>
<text x="200" y="36" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">Type I</text>
<text x="200" y="51" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">惑星に届く太陽エネルギーを使い切る</text>
<rect x="12" y="88" width="376" height="46" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="108" font-size="12" text-anchor="middle" fill="#0b0b0b">Type II</text>
<text x="200" y="123" font-size="12" text-anchor="middle" fill="#0b0b0b">恒星のエネルギーを丸ごと使う</text>
<rect x="12" y="160" width="376" height="46" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="180" font-size="12" text-anchor="middle" fill="#0b0b0b">Type III</text>
<text x="200" y="195" font-size="12" text-anchor="middle" fill="#0b0b0b">銀河系規模のエネルギーを使う</text>
<path d="M200,62 L200,82" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M196.4,82 L203.6,82 L200,88 Z" fill="#c3c2b7"/>
<path d="M200,134 L200,154" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M196.4,154 L203.6,154 L200,160 Z" fill="#c3c2b7"/>
</svg>
