<text x="12" y="372" font-size="10" fill="#898781">出典: 各社公式料金ページ（2026年7月時点）。</text>
<text x="12" y="385" font-size="10" fill="#898781">Vercel Pro は1シート$20/月・帯域1TB込み、</text>
<text x="12" y="398" font-size="10" fill="#898781">超過は$0.15/GB。Netlify Pro は$20/月・</text>
<text x="12" y="411" font-size="10" fill="#898781">3,000クレジット込み、帯域20クレジット/GB。</text>
