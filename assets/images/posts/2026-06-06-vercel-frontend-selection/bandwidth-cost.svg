<svg viewBox="0 0 400 426" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hc-title hc-desc">
<title id="hc-title">Vercel・Cloudflare Pages・Netlify の帯域別月額コスト比較</title>
<desc id="hc-desc">帯域1TB/月ではVercel Pro $20、Cloudflare Pages $5、Netlify Pro 約$133。帯域5TB/月ではVercel Pro 約$620、Cloudflare Pages $5、Netlify Pro 約$667。Cloudflare Pagesだけ帯域が増えても$5のまま変わらない。2026年7月時点の各社公式料金による。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
<rect x="0" y="0" width="400" height="426" rx="8" fill="#fcfcfb"/>
<text x="12" y="24" font-size="17" font-weight="700" fill="#0b0b0b">ホスティング3社の月額コスト</text>
<text x="12" y="44" font-size="12" fill="#52514e">1TB/月までは差がつかない。差が開くのは</text>
<text x="12" y="60" font-size="12" fill="#52514e">Vercel の込み枠を超えてから。</text>
<text x="12" y="94" font-size="13" font-weight="600" fill="#52514e">帯域 1TB/月</text>
