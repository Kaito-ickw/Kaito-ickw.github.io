<text x="12" y="372" font-size="10" fill="#898781">Source: official pricing pages (July 2026).</text>
<text x="12" y="385" font-size="10" fill="#898781">Vercel Pro is $20/month per seat with 1TB</text>
<text x="12" y="398" font-size="10" fill="#898781">included, then $0.15/GB. Netlify Pro is $20 with</text>
<text x="12" y="411" font-size="10" fill="#898781">3,000 credits; bandwidth costs 20 credits/GB.</text>
