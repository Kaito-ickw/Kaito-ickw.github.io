<svg viewBox="0 0 400 426" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hc-title hc-desc">
<title id="hc-title">Monthly cost of Vercel, Cloudflare Pages and Netlify by bandwidth</title>
<desc id="hc-desc">At 1TB/month: Vercel Pro $20, Cloudflare Pages $5, Netlify Pro about $133. At 5TB/month: Vercel Pro about $620, Cloudflare Pages $5, Netlify Pro about $667. Only Cloudflare Pages stays at $5 as bandwidth grows. Based on official pricing as of July 2026.</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
<rect x="0" y="0" width="400" height="426" rx="8" fill="#fcfcfb"/>
<text x="12" y="24" font-size="17" font-weight="700" fill="#0b0b0b">Monthly cost of three hosts</text>
<text x="12" y="44" font-size="12" fill="#52514e">At 1TB/month there is barely a gap. It opens</text>
<text x="12" y="60" font-size="12" fill="#52514e">once Vercel's included allowance runs out.</text>
<text x="12" y="94" font-size="13" font-weight="600" fill="#52514e">1TB / month</text>
