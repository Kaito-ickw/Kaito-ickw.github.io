<svg viewBox="0 0 400 496" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="felixloop-title felixloop-desc">
<title id="felixloop-title">Felixのループと人間の介入点</title>
<desc id="felixloop-desc">Natが音声メモで方針を渡すと、Felixが計画を立て、サブエージェントのIrisとRemyがサポートと営業を実行する。コード作成、デプロイ、決済処理はFelixが人手を介さず行う。外部公開にあたるXの投稿だけは人間の承認を通す。夜間の自己改善ループで、その日に人間の手が必要だった箇所を洗い出し、自動化の範囲を広げてから翌日の計画へ戻る。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
