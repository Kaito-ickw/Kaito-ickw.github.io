<text x="192" y="164" font-size="12" text-anchor="middle" fill="#0b0b0b">Iris（サポート）</text>
<text x="192" y="179" font-size="12" text-anchor="middle" fill="#0b0b0b">Remy（営業）</text>
<rect x="12" y="216" width="360" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="192" y="236" font-size="12" text-anchor="middle" fill="#0b0b0b">実装・デプロイ・決済処理</text>
