<path d="M196.4,402 L203.6,402 L200,408 Z" fill="#c3c2b7"/>
<path d="M200,446 L200,480" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M196.4,480 L203.6,480 L200,486 Z" fill="#c3c2b7"/>
<rect x="186" y="457" width="28" height="13" rx="3" fill="#fcfcfb" opacity="0.95"/>
