<path d="M28,309.5 L24,309.5 Q17,309.5 17,302.5 L17,181.5 Q17,174.5 24,174.5 L22,174.5" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
