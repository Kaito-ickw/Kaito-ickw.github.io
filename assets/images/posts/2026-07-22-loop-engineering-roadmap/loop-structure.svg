<path d="M372,427 L376,427 Q383,427 383,420 L383,124.5 Q383,117.5 376,117.5 L378,117.5" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M378,113.9 L378,121.1 L372,117.5 Z" fill="#c3c2b7"/>
<rect x="355" y="263.2" width="28" height="13" rx="3" fill="#fcfcfb" opacity="0.95"/>
<text x="379" y="273.2" font-size="10" text-anchor="end" fill="#52514e">継続</text>
</svg>
