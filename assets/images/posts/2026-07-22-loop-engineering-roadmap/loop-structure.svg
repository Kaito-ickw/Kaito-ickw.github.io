<svg viewBox="0 0 400 533" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="loopja-title loopja-desc">
<title id="loopja-title">自律ループの骨格</title>
<desc id="loopja-desc">時刻やイベントを起動条件として作業を取得し、エージェントが実行する。機械的な検証に失敗したら原因と状態を記録して実行へ戻る。合格したら人間の承認を経て状態を保存し、停止条件を見て継続か終了かを決める。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
<rect x="0" y="0" width="400" height="533" rx="8" fill="#fcfcfb"/>
<rect x="28" y="16" width="344" height="46" rx="6" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1"/>
<text x="200" y="36" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">起動条件</text>
<text x="200" y="51" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">時刻・イベント</text>
<rect x="28" y="102" width="344" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="122" font-size="12" text-anchor="middle" fill="#0b0b0b">作業を取得</text>
<rect x="28" y="159" width="344" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="179" font-size="12" text-anchor="middle" fill="#0b0b0b">エージェントが実行</text>
<polygon points="41,216 359,216 372,235 359,254 41,254 28,235" fill="#fcfaf4" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="239.5" font-size="12" text-anchor="middle" fill="#0b0b0b">機械的な検証</text>
<rect x="28" y="294" width="166" height="31" rx="6" fill="#fdf1eb" stroke="#eb6834" stroke-width="1"/>
<text x="111" y="314" font-size="12" text-anchor="middle" fill="#0b0b0b">原因と状態を記録</text>
<rect x="206" y="294" width="166" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="289" y="314" font-size="12" text-anchor="middle" fill="#0b0b0b">人間の承認</text>
<rect x="28" y="351" width="344" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="371" font-size="12" text-anchor="middle" fill="#0b0b0b">状態を保存</text>
<polygon points="41,408 359,408 372,427 359,446 41,446 28,427" fill="#fcfaf4" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="431.5" font-size="12" text-anchor="middle" fill="#0b0b0b">停止条件</text>
<rect x="28" y="486" width="344" height="31" rx="6" fill="#eef8f4" stroke="#1baf7a" stroke-width="1"/>
<text x="200" y="506" font-size="12" text-anchor="middle" fill="#0b0b0b">完了</text>
