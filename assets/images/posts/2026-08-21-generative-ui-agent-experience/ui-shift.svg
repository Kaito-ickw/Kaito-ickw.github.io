<svg viewBox="0 0 400 552" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="uishift-title uishift-desc">
<title id="uishift-title">UIの重心の移動</title>
<desc id="uishift-desc">従来のアプリケーションでは、人間が事前に作り込まれたUIを操作し、UIがAPIを呼び、APIがデータへ届くという一本の経路しかない。エージェント中心の構成では、人間はその場で生成されるUIと対話し、そのUIをAIエージェントが組み立てる。APIやデータとのやり取りは人間のUIを経由せず、エージェントが直接行う。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
<rect x="0" y="0" width="400" height="552" rx="8" fill="#fcfcfb"/>
<rect x="12" y="16" width="376" height="238" rx="8" fill="none" stroke="#e1e0d9" stroke-width="1"/>
<text x="22" y="30" font-size="13" font-weight="600" fill="#52514e">従来のアプリケーション</text>
<rect x="22" y="42" width="356" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="62" font-size="12" text-anchor="middle" fill="#0b0b0b">人間</text>
<rect x="22" y="99" width="356" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="119" font-size="12" text-anchor="middle" fill="#0b0b0b">事前に作り込まれたUI</text>
<rect x="22" y="156" width="356" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="176" font-size="12" text-anchor="middle" fill="#0b0b0b">API</text>
<rect x="22" y="213" width="356" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="233" font-size="12" text-anchor="middle" fill="#0b0b0b">データ</text>
<path d="M200,73 L200,93" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M196.4,93 L203.6,93 L200,99 Z" fill="#c3c2b7"/>
<path d="M200,130 L200,150" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M196.4,150 L203.6,150 L200,156 Z" fill="#c3c2b7"/>
<path d="M200,187 L200,207" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M196.4,207 L203.6,207 L200,213 Z" fill="#c3c2b7"/>
<rect x="12" y="270" width="376" height="266" rx="8" fill="none" stroke="#e1e0d9" stroke-width="1"/>
<text x="22" y="284" font-size="13" font-weight="600" fill="#52514e">エージェント中心の構成</text>
<rect x="22" y="296" width="340" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="192" y="316" font-size="12" text-anchor="middle" fill="#0b0b0b">人間</text>
<rect x="22" y="367" width="340" height="31" rx="6" fill="#eef8f4" stroke="#1baf7a" stroke-width="1"/>
<text x="192" y="387" font-size="12" text-anchor="middle" fill="#0b0b0b">その場で生成されるUI</text>
<rect x="22" y="424" width="340" height="31" rx="6" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1"/>
<text x="192" y="444" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">AIエージェント</text>
<rect x="22" y="495" width="340" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="192" y="515" font-size="12" text-anchor="middle" fill="#0b0b0b">API・データ</text>
<path d="M192,333 L192,361" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M188.4,361 L195.6,361 L192,367 Z" fill="#c3c2b7"/>
