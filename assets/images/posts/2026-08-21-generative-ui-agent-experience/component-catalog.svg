<svg viewBox="0 0 400 291" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="catalog-title catalog-desc">
<title id="catalog-title">コンポーネントカタログによる描画</title>
<desc id="catalog-desc">エージェントはUIの構成を宣言的なJSONデータとして返す。そこから参照できるのはクライアントが事前に登録したコンポーネントカタログの部品だけで、描画はクライアント側が自分のスタイルで行う。実行可能なコードを受け取らないことで、UIインジェクションを避ける。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
<rect x="0" y="0" width="400" height="291" rx="8" fill="#fcfcfb"/>
<rect x="12" y="16" width="376" height="31" rx="6" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1"/>
<text x="200" y="36" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">エージェント</text>
<rect x="12" y="87" width="376" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="107" font-size="12" text-anchor="middle" fill="#0b0b0b">UIの構成を記述したJSON</text>
<rect x="12" y="158" width="376" height="46" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="178" font-size="12" text-anchor="middle" fill="#0b0b0b">コンポーネントカタログ</text>
<text x="200" y="193" font-size="12" text-anchor="middle" fill="#0b0b0b">登録済みの信頼できる部品</text>
<rect x="12" y="244" width="376" height="31" rx="6" fill="#eef8f4" stroke="#1baf7a" stroke-width="1"/>
<text x="200" y="264" font-size="12" text-anchor="middle" fill="#0b0b0b">描画されたUI</text>
<path d="M200,47 L200,81" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M196.4,81 L203.6,81 L200,87 Z" fill="#c3c2b7"/>
<rect x="166" y="58" width="68" height="13" rx="3" fill="#fcfcfb" opacity="0.95"/>
<text x="200" y="68" font-size="10" text-anchor="middle" fill="#52514e">宣言的に出力</text>
<path d="M200,118 L200,152" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M196.4,152 L203.6,152 L200,158 Z" fill="#c3c2b7"/>
<rect x="156" y="129" width="88" height="13" rx="3" fill="#fcfcfb" opacity="0.95"/>
<text x="200" y="139" font-size="10" text-anchor="middle" fill="#52514e">登録部品だけ参照</text>
<path d="M200,204 L200,238" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M196.4,238 L203.6,238 L200,244 Z" fill="#c3c2b7"/>
<rect x="151" y="215" width="98" height="13" rx="3" fill="#fcfcfb" opacity="0.95"/>
<text x="200" y="225" font-size="10" text-anchor="middle" fill="#52514e">クライアントが描画</text>
</svg>
