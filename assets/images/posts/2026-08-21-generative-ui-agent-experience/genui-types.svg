<svg viewBox="0 0 400 236" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gtypes-title gtypes-desc">
<title id="gtypes-title">Generative UIの3類型</title>
<desc id="gtypes-desc">Static型はフロントエンドが定義済みの部品を持ち、エージェントはどれを出すか選んでデータを流し込むだけ。Declarative型はエージェントがUIの構成をデータとして返し、クライアントが自分の部品で描画する。Open-ended型はエージェントがUI面そのものを返す。下へ行くほどエージェントの自由度が上がり、フロントエンドの制御が減る。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
<rect x="0" y="0" width="400" height="236" rx="8" fill="#fcfcfb"/>
<rect x="12" y="16" width="376" height="46" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="36" font-size="12" text-anchor="middle" fill="#0b0b0b">Static型</text>
<text x="200" y="51" font-size="12" text-anchor="middle" fill="#0b0b0b">定義済み部品から選ぶ</text>
<rect x="12" y="102" width="376" height="46" rx="6" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1"/>
<text x="200" y="122" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">Declarative型</text>
<text x="200" y="137" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">UIの構成をデータで返す</text>
<rect x="12" y="174" width="376" height="46" rx="6" fill="#fdf1eb" stroke="#eb6834" stroke-width="1"/>
<text x="200" y="194" font-size="12" text-anchor="middle" fill="#0b0b0b">Open-ended型</text>
<text x="200" y="209" font-size="12" text-anchor="middle" fill="#0b0b0b">UI面そのものを返す</text>
<path d="M200,62 L200,96" stroke="#898781" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-dasharray="4 3"/>
<path d="M196.4,96 L203.6,96 L200,102 Z" fill="#898781"/>
<rect x="161" y="73" width="78" height="13" rx="3" fill="#fcfcfb" opacity="0.95"/>
<text x="200" y="83" font-size="10" text-anchor="middle" fill="#52514e">自由度が上がる</text>
<path d="M200,148 L200,168" stroke="#898781" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-dasharray="4 3"/>
<path d="M196.4,168 L203.6,168 L200,174 Z" fill="#898781"/>
</svg>
