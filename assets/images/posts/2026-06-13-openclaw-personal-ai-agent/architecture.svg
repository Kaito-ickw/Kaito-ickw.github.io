<svg viewBox="0 0 400 401" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="openclaw-title openclaw-desc">
<title id="openclaw-title">OpenClawの構成</title>
<desc id="openclaw-desc">Telegram・Slack・Discord・WebChatからの入力をOpenClaw Gatewayが受け、LLM providerとTools / Nodesへ振り分ける。Gatewayはチャネルのルーティング、セッション管理、エージェント実行、ToolとSkillのポリシー、cronとイベントの処理を担う。Tools / Nodesの先には、ファイル・シェル・ブラウザ・検索・スマートフォンやPCがある。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
