<svg viewBox="0 0 400 527" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scopeorder-title scopeorder-desc">
<title id="scopeorder-title">事業スコープを決める順序の違い</title>
<desc id="scopeorder-desc">よくある順序では、先に事業を決め、そこへAIを入れ、AIができない部分を人が埋める。埋めた部分はそのまま運用へ残り、恒久的な人手として固定化する。川邊健太郎が置いた順序では、先にAIができる範囲を確認し、その内側で事業を切る。人が必要だと分かった事業は一旦やめる。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
<rect x="0" y="0" width="400" height="527" rx="8" fill="#fcfcfb"/>
<rect x="12" y="16" width="376" height="253" rx="8" fill="none" stroke="#e1e0d9" stroke-width="1"/>
<text x="22" y="30" font-size="13" font-weight="600" fill="#52514e">よくある順序</text>
<rect x="22" y="42" width="356" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="62" font-size="12" text-anchor="middle" fill="#0b0b0b">事業を決める</text>
<rect x="22" y="99" width="356" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="119" font-size="12" text-anchor="middle" fill="#0b0b0b">AIを入れる</text>
<rect x="22" y="156" width="356" height="46" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="176" font-size="12" text-anchor="middle" fill="#0b0b0b">できない部分を</text>
<text x="200" y="191" font-size="12" text-anchor="middle" fill="#0b0b0b">人が埋める</text>
<rect x="22" y="228" width="356" height="31" rx="6" fill="#fdf1eb" stroke="#eb6834" stroke-width="1"/>
<text x="200" y="248" font-size="12" text-anchor="middle" fill="#0b0b0b">人手が固定化する</text>
<path d="M200,73 L200,93" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M196.4,93 L203.6,93 L200,99 Z" fill="#c3c2b7"/>
<path d="M200,130 L200,150" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M196.4,150 L203.6,150 L200,156 Z" fill="#c3c2b7"/>
<path d="M200,202 L200,222" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M196.4,222 L203.6,222 L200,228 Z" fill="#c3c2b7"/>
<rect x="12" y="285" width="376" height="226" rx="8" fill="none" stroke="#e1e0d9" stroke-width="1"/>
<text x="22" y="299" font-size="13" font-weight="600" fill="#52514e">川邊が置いた順序</text>
<rect x="22" y="311" width="356" height="46" rx="6" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1"/>
<text x="200" y="331" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">AIにできる範囲を</text>
<text x="200" y="346" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">確認する</text>
<rect x="22" y="383" width="356" height="46" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="403" font-size="12" text-anchor="middle" fill="#0b0b0b">その内側で</text>
<text x="200" y="418" font-size="12" text-anchor="middle" fill="#0b0b0b">事業を切る</text>
<rect x="22" y="455" width="356" height="46" rx="6" fill="#eef8f4" stroke="#1baf7a" stroke-width="1"/>
<text x="200" y="475" font-size="12" text-anchor="middle" fill="#0b0b0b">人が要ると分かれば</text>
<text x="200" y="490" font-size="12" text-anchor="middle" fill="#0b0b0b">一旦やめる</text>
<path d="M200,357 L200,377" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M196.4,377 L203.6,377 L200,383 Z" fill="#c3c2b7"/>
<path d="M200,429 L200,449" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M196.4,449 L203.6,449 L200,455 Z" fill="#c3c2b7"/>
</svg>
