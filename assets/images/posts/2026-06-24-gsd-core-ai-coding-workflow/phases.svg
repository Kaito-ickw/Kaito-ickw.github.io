<svg viewBox="0 0 400 451" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gsdphase-title gsdphase-desc">
<title id="gsdphase-title">GSDの5つのphaseと戻り</title>
<desc id="gsdphase-desc">Discussで実装上の判断を決め、Planで調査してタスクへ分解し、Executeで計画単位に実装する。Verifyで要件と動作を確認し、不具合があればPlanへ戻る。合格すればShipでPull Requestを作り、次のphaseのDiscussへ入る。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
<rect x="0" y="0" width="400" height="451" rx="8" fill="#fcfcfb"/>
<rect x="12" y="16" width="344" height="46" rx="6" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1"/>
<text x="184" y="36" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">Discuss</text>
<text x="184" y="51" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">実装上の判断を決める</text>
<rect x="12" y="102" width="344" height="46" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="184" y="122" font-size="12" text-anchor="middle" fill="#0b0b0b">Plan</text>
<text x="184" y="137" font-size="12" text-anchor="middle" fill="#0b0b0b">調査してタスクへ分解する</text>
<rect x="12" y="174" width="344" height="46" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="184" y="194" font-size="12" text-anchor="middle" fill="#0b0b0b">Execute</text>
<text x="184" y="209" font-size="12" text-anchor="middle" fill="#0b0b0b">計画単位で実装する</text>
<polygon points="25,246 343,246 356,269 343,292 25,292 12,269" fill="#fcfaf4" stroke="#c3c2b7" stroke-width="1"/>
<text x="184" y="266" font-size="12" text-anchor="middle" fill="#0b0b0b">Verify</text>
<text x="184" y="281" font-size="12" text-anchor="middle" fill="#0b0b0b">要件と動作を確認する</text>
<rect x="12" y="332" width="344" height="46" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="184" y="352" font-size="12" text-anchor="middle" fill="#0b0b0b">Ship</text>
<text x="184" y="367" font-size="12" text-anchor="middle" fill="#0b0b0b">Pull Requestを作る</text>
<rect x="12" y="404" width="344" height="31" rx="6" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="184" y="424" font-size="12" text-anchor="middle" fill="#52514e">次のphase</text>
<path d="M184,62 L184,96" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M180.4,96 L187.6,96 L184,102 Z" fill="#c3c2b7"/>
<path d="M184,148 L184,168" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M180.4,168 L187.6,168 L184,174 Z" fill="#c3c2b7"/>
<path d="M184,220 L184,240" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M180.4,240 L187.6,240 L184,246 Z" fill="#c3c2b7"/>
<path d="M184,292 L184,326" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M180.4,326 L187.6,326 L184,332 Z" fill="#c3c2b7"/>
<rect x="170" y="303" width="28" height="13" rx="3" fill="#fcfcfb" opacity="0.95"/>
<text x="184" y="313" font-size="10" text-anchor="middle" fill="#52514e">合格</text>
<path d="M184,378 L184,398" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M180.4,398 L187.6,398 L184,404 Z" fill="#c3c2b7"/>
<path d="M356,269 L360,269 Q367,269 367,262 L367,132 Q367,125 360,125 L362,125" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M362,121.4 L362,128.6 L356,125 Z" fill="#c3c2b7"/>
<rect x="309" y="188" width="58" height="13" rx="3" fill="#fcfcfb" opacity="0.95"/>
<text x="363" y="198" font-size="10" text-anchor="end" fill="#52514e">不具合あり</text>
<path d="M356,419.5 L376,419.5 Q383,419.5 383,412.5 L383,46 Q383,39 376,39 L362,39" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
