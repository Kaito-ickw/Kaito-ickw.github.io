<svg viewBox="0 0 400 581" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gsdroles-title gsdroles-desc">
<title id="gsdroles-title">オーケストレーターと4つのサブエージェント</title>
<desc id="gsdroles-desc">ユーザーがGSDコマンドを打つと、オーケストレーターが状態を確認して処理を振り分け、researcher・planner・executor・verifierのいずれかを動かす。調査と計画の成果は.planning/へ書かれ、executorがそれを読んでソースコードとGitを変更し、verifierが結果を.planning/へ書き戻す。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
