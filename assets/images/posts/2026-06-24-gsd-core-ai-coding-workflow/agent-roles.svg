<text x="200" y="36" font-size="12" text-anchor="middle" fill="#0b0b0b">ユーザー</text>
<rect x="12" y="73" width="376" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="93" font-size="12" text-anchor="middle" fill="#0b0b0b">GSDコマンド</text>
