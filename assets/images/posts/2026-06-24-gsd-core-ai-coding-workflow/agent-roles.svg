<text x="200" y="150" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">オーケストレーター</text>
<text x="200" y="165" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">状態確認と処理の振り分け</text>
