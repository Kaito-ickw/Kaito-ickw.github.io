<rect x="12" y="379" width="344" height="31" rx="6" fill="#fdf1eb" stroke="#eb6834" stroke-width="1"/>
<text x="184" y="399" font-size="12" text-anchor="middle" fill="#0b0b0b">データ・報酬設計を見直す</text>
