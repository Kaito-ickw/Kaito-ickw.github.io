<svg viewBox="0 0 400 426" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tinker-title tinker-desc">
<title id="tinker-title">運用ログを学習へ回すループ</title>
<desc id="tinker-desc">エージェントがIssueやタスクを処理し、テスト結果・レビュー・人間評価を記録する。成功と失敗を報酬または教師データへ変換し、TinkerでSFT・DPO・RLを実行して学習済み重みを再配置する。同じ評価セットで改善を検証し、改善が確認できれば運用へ戻し、悪化や変化なしならデータと報酬設計を見直す。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
<rect x="0" y="0" width="400" height="426" rx="8" fill="#fcfcfb"/>
<rect x="12" y="16" width="344" height="31" rx="6" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1"/>
<text x="184" y="36" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">エージェントがIssue/タスクを処理</text>
<rect x="12" y="73" width="344" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="184" y="93" font-size="12" text-anchor="middle" fill="#0b0b0b">テスト結果・レビュー・人間評価を記録</text>
<rect x="12" y="130" width="344" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="184" y="150" font-size="12" text-anchor="middle" fill="#0b0b0b">成功/失敗を報酬または教師データへ変換</text>
<rect x="12" y="187" width="344" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="184" y="207" font-size="12" text-anchor="middle" fill="#0b0b0b">TinkerでSFT・DPO・RLを実行</text>
<rect x="12" y="244" width="344" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="184" y="264" font-size="12" text-anchor="middle" fill="#0b0b0b">学習済み重みを再配置</text>
