<svg viewBox="0 0 400 222" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wsstages-title wsstages-desc">
<title id="wsstages-title">Workspace Studioのワークフローの3段</title>
<desc id="wsstages-desc">Gmailの受信やSheetsの行追加、Formsの回答などがスターターとなり、Geminiが内容を読んで判断・分類・要約・生成を行い、Draft作成やSheetsへの書き込み、Chat通知、外部SaaS連携といったアクションで終わる。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
<rect x="0" y="0" width="400" height="222" rx="8" fill="#fcfcfb"/>
<rect x="12" y="16" width="376" height="46" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="36" font-size="12" text-anchor="middle" fill="#0b0b0b">スターター（トリガー）</text>
<text x="200" y="51" font-size="12" text-anchor="middle" fill="#0b0b0b">Gmail受信・Sheetsの行追加・Formsの回答など</text>
<rect x="12" y="88" width="376" height="46" rx="6" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1"/>
<text x="200" y="108" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">推論（Gemini）</text>
<text x="200" y="123" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">内容を読んで判断・分類・要約・生成</text>
<rect x="12" y="160" width="376" height="46" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="180" font-size="12" text-anchor="middle" fill="#0b0b0b">アクション（出力）</text>
<text x="200" y="195" font-size="12" text-anchor="middle" fill="#0b0b0b">Draft作成・Sheetsへの書き込み・Chat通知・外部SaaS連携</text>
<path d="M200,62 L200,82" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M196.4,82 L203.6,82 L200,88 Z" fill="#c3c2b7"/>
<path d="M200,134 L200,154" stroke="#c3c2b7" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<path d="M196.4,154 L203.6,154 L200,160 Z" fill="#c3c2b7"/>
</svg>
