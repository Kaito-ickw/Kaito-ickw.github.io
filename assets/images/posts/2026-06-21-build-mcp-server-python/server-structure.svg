<svg viewBox="0 0 400 362" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pysrv-title pysrv-desc">
<title id="pysrv-title">作るMCP Serverの位置</title>
<desc id="pysrv-desc">ユーザーの操作はMCP Hostが受け、MCP Clientがstdio上のJSON-RPCでPython製のMCP Serverと通信する。Serverはlist_notesとread_noteの2つのToolを公開し、どちらもnotesディレクトリのMarkdownを読む。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}</style>
<rect x="0" y="0" width="400" height="362" rx="8" fill="#fcfcfb"/>
<rect x="12" y="16" width="376" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="36" font-size="12" text-anchor="middle" fill="#0b0b0b">ユーザー</text>
