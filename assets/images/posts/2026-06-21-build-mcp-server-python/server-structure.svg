<text x="297" y="278" font-size="12" text-anchor="middle" fill="#0b0b0b">read_note</text>
<rect x="12" y="315" width="376" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="335" font-size="12" text-anchor="middle" fill="#0b0b0b">notes/*.md</text>
