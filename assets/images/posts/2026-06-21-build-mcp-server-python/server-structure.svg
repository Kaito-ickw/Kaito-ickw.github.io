<text x="200" y="93" font-size="12" text-anchor="middle" fill="#0b0b0b">MCP Host</text>
<rect x="12" y="130" width="376" height="31" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="150" font-size="12" text-anchor="middle" fill="#0b0b0b">MCP Client</text>
<rect x="12" y="201" width="376" height="31" rx="6" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1"/>
<text x="200" y="221" font-size="12" font-weight="600" text-anchor="middle" fill="#0b0b0b">Python MCP Server</text>
